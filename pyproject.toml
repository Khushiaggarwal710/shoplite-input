[project]
name = "shoplite"
version = "1.1.0"
description = "ShopLite: a small online-shop JSON API used as the practice codebase in the Applied AI Engineering Bootcamp."
readme = "README.md"
license = "LicenseRef-Course-Owned"
requires-python = ">=3.12,<3.13"
dependencies = [
    "flask==3.1.3",
    "flask-sqlalchemy==3.1.1",
    "sqlalchemy==2.1.8",
    "flask-migrate==4.1.0",
    "alembic==1.20.1",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff>=0.17,<0.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shoplite"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
